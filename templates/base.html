<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}投稿審查系統{% endblock %}｜稿件室</title>
  <style>
    :root { color-scheme: light; --ink:#17231f; --muted:#68756e; --line:#e4e9e5; --paper:#fff; --canvas:#f4f6f3; --green:#176b4d; --green-dark:#10563d; --mint:#e7f4ed; --amber:#fff3d8; --blue:#eaf1ff; --shadow:0 18px 48px rgba(23,35,31,.07); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:15px; line-height:1.65; }
    a { color:inherit; text-decoration:none; }
    button,input,select,textarea { font:inherit; }
    .topbar { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 max(24px,calc((100% - 1160px)/2)); background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:.02em; }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; border-radius:12px; color:#fff; background:var(--green); font-size:17px; }
    .top-actions { display:flex; align-items:center; gap:20px; color:var(--muted); font-size:14px; }
    .identity { color:var(--ink); font-weight:650; }
    .logout { border:0; padding:0; background:none; color:var(--muted); cursor:pointer; }
    .shell { max-width:1160px; margin:0 auto; padding:38px 24px 72px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:4px 0 8px; font-size:30px; line-height:1.3; letter-spacing:-.03em; }
    h2 { margin:0; font-size:19px; }
    h3 { margin:0 0 12px; font-size:16px; }
    .intro { margin:0; color:var(--muted); }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; padding:9px 16px; border:1px solid transparent; border-radius:10px; background:var(--green); color:#fff; font-weight:700; cursor:pointer; transition:.15s ease; }
    .button:hover { background:var(--green-dark); transform:translateY(-1px); }
    .button.secondary { border-color:var(--line); background:#fff; color:var(--ink); }
    .button.secondary:hover { border-color:#b9c8be; background:#f9fbf9; }
    .button.danger { background:#a93c37; }
    .button.small { min-height:34px; padding:6px 11px; font-size:13px; }
    .button:disabled { opacity:.5; cursor:not-allowed; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:24px 0; }
    .stat { padding:17px 20px; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .stat-label { color:var(--muted); font-size:13px; }
    .stat-value { margin-top:2px; font-size:25px; font-weight:800; }
    .panel { border:1px solid var(--line); border-radius:16px; background:var(--paper); box-shadow:var(--shadow); overflow:hidden; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:18px 21px; border-bottom:1px solid var(--line); }
    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .input,select,textarea { width:100%; border:1px solid #d8e0da; border-radius:9px; padding:10px 12px; color:var(--ink); background:#fff; outline:none; }
    .input:focus,select:focus,textarea:focus { border-color:#7db69b; box-shadow:0 0 0 3px rgba(23,107,77,.1); }
    .toolbar .input { width:230px; }
    .toolbar select { width:auto; min-width:140px; }
    table { width:100%; border-collapse:collapse; }
    th { padding:12px 20px; color:var(--muted); background:#fafbfa; text-align:left; font-size:12px; font-weight:700; }
    td { padding:16px 20px; border-top:1px solid var(--line); vertical-align:middle; }
    tr:hover td { background:#fcfdfc; }
    .title-link { display:block; max-width:520px; font-weight:750; }
    .title-link:hover { color:var(--green); }
    .subtext { color:var(--muted); font-size:13px; }
    .status { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:4px 10px; border-radius:999px; color:#59655f; background:#edf0ee; font-size:12px; font-weight:750; }
    .status.editing { color:#6c5015; background:var(--amber); }
    .status.in_review { color:#31518b; background:var(--blue); }
    .status.approved { color:#176b4d; background:var(--mint); }
    .notice { margin:0 0 18px; padding:12px 15px; border:1px solid #b9dfc8; border-radius:10px; color:#155f40; background:#eef9f2; }
    .error { margin:0 0 18px; padding:12px 15px; border:1px solid #efc7c3; border-radius:10px; color:#8c2d29; background:#fff2f0; }
    .empty { padding:52px 20px; color:var(--muted); text-align:center; }
    .empty strong { display:block; margin-bottom:5px; color:var(--ink); font-size:17px; }
    .form-panel { max-width:840px; padding:26px; }
    .field { margin-bottom:20px; }
    .field label { display:block; margin-bottom:7px; font-size:14px; font-weight:750; }
    .field textarea { min-height:300px; resize:vertical; line-height:1.8; }
    .hint { margin-top:5px; color:var(--muted); font-size:12px; }
    .form-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:8px; }
    .action-group { display:flex; align-items:center; gap:10px; }
    .detail-grid { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:20px; align-items:start; }
    .article { padding:30px; }
    .article h1 { margin:12px 0 14px; font-size:28px; }
    .article-meta { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
    .article-content { margin-top:28px; white-space:pre-wrap; overflow-wrap:anywhere; line-height:2; }
    .side-panel { padding:20px; }
    .side-panel + .side-panel { margin-top:14px; }
    .meta-row { display:flex; justify-content:space-between; gap:10px; margin:11px 0; font-size:13px; }
    .meta-row span:first-child { color:var(--muted); }
    .review-history { list-style:none; padding:0; margin:0; }
    .review-history li { padding:13px 0; border-top:1px solid var(--line); }
    .review-history li:first-child { border-top:0; }
    .review-note { margin-top:6px; color:var(--muted); white-space:pre-wrap; font-size:13px; }
    .login-wrap { min-height:calc(100vh - 72px); display:grid; place-items:center; padding:30px 20px; }
    .login-card { width:min(100%,440px); padding:32px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:var(--shadow); }
    .login-card h1 { margin:5px 0 8px; font-size:27px; }
    .demo-box { margin-top:21px; padding:14px; border-radius:11px; background:#f4f7f4; color:var(--muted); font-size:13px; }
    .demo-box div { margin-top:5px; color:var(--ink); }
    @media(max-width:760px) { .shell { padding:27px 15px 50px; } .topbar { padding:0 15px; } .top-actions { gap:11px; } .identity { display:none; } .page-head { align-items:flex-start; flex-direction:column; } .stats { gap:8px; } .stat { padding:13px; } .stat-value { font-size:21px; } .panel { overflow-x:auto; } table { min-width:640px; } .toolbar { width:100%; } .toolbar .input,.toolbar select { flex:1; width:auto; min-width:110px; } .detail-grid { grid-template-columns:1fr; } .form-panel { padding:19px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="稿件室首頁"><span class="brand-mark">稿</span><span>稿件室 <span class="subtext">投稿審查</span></span></a>
    {% if user %}
    <div class="top-actions">
      <span class="identity">{{ user.display_name }}・{{ "作者" if user.role == "author" else "編輯" }}</span>
      {% if user.role == "author" %}<a href="/author/submissions">我的稿件</a>{% else %}<a href="/editor/reviews">審查工作台</a>{% endif %}
      <form method="post" action="/logout"><button class="logout" type="submit">登出</button></form>
    </div>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
</body>
</html>
