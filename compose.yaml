services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: submission_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdemo123}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d submission_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-localdemo123}@db:5432/submission_demo
      SECRET_KEY: ${SECRET_KEY:-local-docker-demo-key-change-before-deploy}
    ports:
      - "8081:8000"

volumes:
  postgres_data:
